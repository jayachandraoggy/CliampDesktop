name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Verify tag matches crate version
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          CRATE_VERSION=$(grep '^version' Cargo.toml | head -1 | sed 's/.*"\(.*\)".*/\1/')
          if [ "$TAG" != "$CRATE_VERSION" ]; then
            echo "Tag v${TAG} does not match Cargo.toml version ${CRATE_VERSION}" >&2
            exit 1
          fi

      - name: Fetch bundled cliamp
        run: ./scripts/fetch-cliamp.sh

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            pkg-config \
            libgtk-3-dev \
            libxcb-render0-dev \
            libxcb-shape0-dev \
            libxcb-xfixes0-dev \
            libxkbcommon-x11-dev \
            libssl-dev

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Install cargo-deb
        run: cargo install cargo-deb --locked --force

      - name: Build release binary
        run: cargo build --release --locked

      - name: Strip binaries
        run: |
          strip target/release/cliamprustdesktop
          strip packaging/cliamp

      - name: Build deb package
        run: cargo deb --no-build --locked

      - name: Package tarball
        run: |
          TAG="${GITHUB_REF_NAME}"
          VERSION="${TAG#v}"
          TAR="cliamprustdesktop-${TAG}-x86_64-unknown-linux-gnu.tar.gz"
          mkdir -p dist
          cp target/release/cliamprustdesktop packaging/cliamp assets/README-INSTALL.txt dist/
          tar -czf "$TAR" -C dist cliamprustdesktop cliamp README-INSTALL.txt
          sha256sum "$TAR" > "${TAR}.sha256"

      - name: Checksum deb package
        run: |
          DEB=$(ls target/debian/cliamprustdesktop_*_amd64.deb)
          sha256sum "$DEB" > "${DEB}.sha256"

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          body: |
            ## Install (recommended)

            ```bash
            sudo dpkg -i cliamprustdesktop_*_amd64.deb
            sudo apt-get install -f
            ```

            This package includes **cliamp** and **cliamprustdesktop** — no separate cliamp install required.

            **ffmpeg** is recommended for AAC, Opus, and HLS (`sudo apt install ffmpeg`).

            ## Tarball

            Extract and copy both binaries to a directory on your `PATH`, or use the `.deb` above.
          files: |
            cliamprustdesktop-*-x86_64-unknown-linux-gnu.tar.gz
            cliamprustdesktop-*-x86_64-unknown-linux-gnu.tar.gz.sha256
            target/debian/cliamprustdesktop_*_amd64.deb
            target/debian/cliamprustdesktop_*_amd64.deb.sha256
