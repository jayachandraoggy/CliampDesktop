[package]
name = "cliamprustdesktop"
version = "0.1.0"
edition = "2021"
description = "Desktop GUI for cliamp — Cliamp Radio and Radio Browser"
license = "MIT"

[dependencies]
anyhow = "1"
directories = "5"
eframe = { version = "0.31", default-features = true, features = ["default_fonts", "glow"] }
egui = "0.31"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
