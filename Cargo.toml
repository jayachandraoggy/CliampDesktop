[package]
name = "cliamprustdesktop"
version = "0.1.1"
edition = "2021"
description = "Desktop GUI for cliamp — Cliamp Radio and Radio Browser"
license = "MIT"

[package.metadata.deb]
maintainer = "Jaya Chandra <jayachandraoggy@gmail.com>"
copyright = "2026, Jaya Chandra"
license-file = ["LICENSE", "4"]
section = "sound"
priority = "optional"
depends = "libasound2, $auto"
recommends = "ffmpeg"
extended-description = """\
Desktop GUI for cliamp — Cliamp Radio and Radio Browser on Linux.
This package installs the cliamprustdesktop application and bundles the \
cliamp playback engine in /usr/bin. Requires Ubuntu 22.04 or compatible \
(libc6 >= 2.35). ffmpeg is recommended for some codecs."""
assets = [
    ["target/release/cliamprustdesktop", "usr/bin/", "755"],
    ["packaging/cliamp", "usr/bin/cliamp", "755"],
    ["assets/cliamprustdesktop.desktop", "usr/share/applications/", "644"],
    ["assets/copyright", "usr/share/doc/cliamprustdesktop/copyright", "644"],
]

[dependencies]
anyhow = "1"
directories = "5"
eframe = { version = "0.31", default-features = true, features = ["default_fonts", "glow"] }
egui = "0.31"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
