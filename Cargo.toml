[package]
name = "hertz"
version = "0.2.0"
edition = "2021"
description = "Hertz — desktop radio streaming (Cliamp Radio and Radio Browser)"
license = "MIT"

[package.metadata.deb]
maintainer = "Jaya Chandra <jayachandraoggy@gmail.com>"
copyright = "2026, Jaya Chandra"
license-file = ["LICENSE", "4"]
section = "sound"
priority = "optional"
depends = "libasound2, $auto"
recommends = "ffmpeg"
replaces = "cliamprustdesktop"
extended-description = """\
Hertz is a desktop GUI for listening to internet radio via cliamp — \
Cliamp Radio and Radio Browser on Linux.
This package installs the hertz application and bundles the cliamp playback \
engine in /usr/bin. Requires Ubuntu 22.04 or compatible (libc6 >= 2.35). \
ffmpeg is recommended for some codecs."""
assets = [
    ["target/release/hertz", "usr/bin/", "755"],
    ["packaging/cliamp", "usr/bin/cliamp", "755"],
    ["assets/hertz.desktop", "usr/share/applications/", "644"],
    ["assets/copyright", "usr/share/doc/hertz/copyright", "644"],
    ["assets/icons/hicolor/16x16/apps/hertz.png", "usr/share/icons/hicolor/16x16/apps/", "644"],
    ["assets/icons/hicolor/24x24/apps/hertz.png", "usr/share/icons/hicolor/24x24/apps/", "644"],
    ["assets/icons/hicolor/32x32/apps/hertz.png", "usr/share/icons/hicolor/32x32/apps/", "644"],
    ["assets/icons/hicolor/48x48/apps/hertz.png", "usr/share/icons/hicolor/48x48/apps/", "644"],
    ["assets/icons/hicolor/64x64/apps/hertz.png", "usr/share/icons/hicolor/64x64/apps/", "644"],
    ["assets/icons/hicolor/128x128/apps/hertz.png", "usr/share/icons/hicolor/128x128/apps/", "644"],
    ["assets/icons/hicolor/256x256/apps/hertz.png", "usr/share/icons/hicolor/256x256/apps/", "644"],
    ["assets/icons/hicolor/512x512/apps/hertz.png", "usr/share/icons/hicolor/512x512/apps/", "644"],
]

[dependencies]
anyhow = "1"
directories = "5"
eframe = { version = "0.31", default-features = true, features = ["default_fonts", "glow"] }
egui = "0.31"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
